<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Reading List</title>
  <style>body{font-family:Arial;max-width:600px;margin:40px auto;padding:20px}input,button{padding:10px;margin:5px 0}li{margin:12px 0}button{cursor:pointer}</style>
</head>
<body>
  <h1>My Reading List</h1>
  <input id="bookInput" placeholder="Enter a book title" />
  <button id="addButton">Add book</button>
  <ul id="bookList"></ul>
  <script>
    const input = document.querySelector("#bookInput");
    const list = document.querySelector("#bookList");
    document.querySelector("#addButton").addEventListener("click", () => {
      const title = input.value.trim();
      if (!title) return;
      const item = document.createElement("li");
      item.textContent = title + " ";
      const doneButton = document.createElement("button");
      doneButton.textContent = "Mark read";
      doneButton.addEventListener("click", () => { item.style.textDecoration = "line-through"; doneButton.disabled = true; });
      item.appendChild(doneButton);
      list.appendChild(item);
      input.value = "";
    });
  </script>
</body>
</html>
